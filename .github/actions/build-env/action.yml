name: Compilation environment preparation
description: Install the host dependencies and configure the build environment.
runs:
  using: composite
  steps:
    - name: 🧩 Load centralized config
      shell: bash
      run: |
        set -euo pipefail

        source "$GITHUB_WORKSPACE/.github/config/nova-env.sh"
        resolve_device_config "$VARIANT"

        {
          echo "KERNEL_NAME=$KERNEL_NAME"
          echo "OS=$OS"
          echo "CLANG_VERSION=$CLANG_VERSION"
          echo "CLANG_URL=$CLANG_URL"
          echo "AVBTOOL_URL=$AVBTOOL_URL"
          echo "KSU_SETUP_URL=$KSU_SETUP_URL"
          echo "NOMOUNT_SETUP_URL=$NOMOUNT_SETUP_URL"
          echo "BACKPORT_PATCH_URL=$BACKPORT_PATCH_URL"
          echo "HOOK_PATCH_URL_SCOPE_MIN=$HOOK_PATCH_URL_SCOPE_MIN"
          echo "HOOK_PATCH_URL_RKSU=$HOOK_PATCH_URL_RKSU"
          echo "HOOK_PATCH_URL_SYSCALL=$HOOK_PATCH_URL_SYSCALL"
          echo "HOOK_PATCH_URL_INLINE=$HOOK_PATCH_URL_INLINE"
          echo "AK3_REPO=$AK3_REPO"
          echo "AK3_BANNER_URL=$AK3_BANNER_URL"
          echo "DEVICE_IMAGE=$DEVICE_IMAGE"
          echo "DEFCONFIG=$DEFCONFIG"
          echo "STOCK_IMAGE_URL=$STOCK_IMAGE_URL"
          echo "DTB_NAME=$DTB_NAME"
        } >> "$GITHUB_ENV"

        echo "✅ Config loaded — variant=$VARIANT device=$DEVICE_IMAGE defconfig=$DEFCONFIG os=$OS"

    - name: 📦 Install host dependencies
      shell: bash
      run: |
        set -euo pipefail
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📦 Installing build dependencies"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        sudo apt-get update -qq
        sudo apt-get install -y \
          git curl wget unzip tar zstd lz4 zip patch file \
          bc bison flex libssl-dev libelf-dev libncurses-dev \
          python3 cpio rsync make gcc g++ binutils

    - name: 💾 Configure swap
      shell: bash
      run: |
        set -euo pipefail
        sudo fallocate -l 10G /swapfile || true
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile >/dev/null 2>&1 || true
        sudo swapon /swapfile 2>/dev/null || true
        echo "Swap: $(free -h | awk '/Swap:/ {print $2}')"

    - name: 🧭 Initialize build paths
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$HOME/toolchains" "$HOME/toolchains/images" "$RUNNER_TEMP/novakernel"
        echo "TC_DIR=$HOME/toolchains" >> "$GITHUB_ENV"
        echo "OUT_DIR=$GITHUB_WORKSPACE/out" >> "$GITHUB_ENV"
        echo "WORK_DIR=$RUNNER_TEMP/novakernel" >> "$GITHUB_ENV"
