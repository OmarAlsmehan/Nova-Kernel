name: Upload to Telegram
description: Upload the generated NovaKernel package to Telegram
inputs:
  bot-token:
    description: Telegram bot token
    required: true
  chat-id:
    description: Telegram chat ID
    required: true
  release-type:
    description: Release type
    required: false
    default: beta
  changelog:
    description: Release changelog
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: 📤 Upload package
      shell: bash
      env:
        TG_BOT_TOKEN: ${{ inputs.bot-token }}
        TG_CHAT_ID: ${{ inputs.chat-id }}
        RELEASE_TYPE: ${{ inputs.release-type }}
        CHANGELOG: ${{ inputs.changelog }}
      run: |
        set -euo pipefail

        : "${TG_BOT_TOKEN:?Missing repository secret TG_BOT_TOKEN}"
        : "${TG_CHAT_ID:?Missing repository secret TG_CHAT_ID}"
        : "${ZIP_PATH:?ZIP_PATH is required}"

        DEVICE="${VARIANT}"
        TYPE="${PACKAGE_MODE:-unknown}"
        RELEASE_LABEL="${RELEASE_TYPE:-beta}"
        FULL_SHA="${GITHUB_SHA}"
        REPO="${GITHUB_REPOSITORY}"
        COMMIT_LINK="https://github.com/${REPO}/commit/${FULL_SHA}"
        RUN_LINK="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

        # Escape user-provided changelog text for Telegram HTML.
        CHANGELOG_HTML="${CHANGELOG}"
        CHANGELOG_HTML="${CHANGELOG_HTML//&/&amp;}"
        CHANGELOG_HTML="${CHANGELOG_HTML//</&lt;}"
        CHANGELOG_HTML="${CHANGELOG_HTML//>/&gt;}"
        CHANGELOG_HTML="${CHANGELOG_HTML//$'\r'/}"

        # Preserve each changelog line as a bullet.
        if [[ -n "$CHANGELOG_HTML" ]]; then
          BULLETS=""
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -n "$line" ]] || continue
            BULLETS+="● ${line}"$'\n'
          done <<< "$CHANGELOG_HTML"
        else
          BULLETS="● No changelog provided"$'\n'
        fi

        CAPTION="$(printf '📦 <b>%s</b> 📦\n====================\n📱 %s 📱\n\n🖥️ <b>OS:</b> %s\n⚙️ <b>Type:</b> %s\n🏷️ <b>Release:</b> %s\n📝 <b>Changelog:</b>\n%s\n🔗 <b>Commit:</b>\n<a href="%s">%s</a>\n\n⬇️ <b>Manager:</b> <a href="%s">link</a>' \
          "${KERNEL_NAME:?KERNEL_NAME is required}" "${DEVICE}" "${OS:?OS is required}" "${TYPE}" "${RELEASE_LABEL}" "$BULLETS" "$COMMIT_LINK" "$FULL_SHA" "$RUN_LINK")"

        echo "📤 Uploading ${ZIP_NAME} to Telegram..."
        curl -fsS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
          -F "chat_id=${TG_CHAT_ID}" \
          -F "document=@${ZIP_PATH};filename=${ZIP_NAME}" \
          --form-string "caption=${CAPTION}" \
          --form-string "parse_mode=HTML"

        echo "✅ Telegram upload finished: ${ZIP_NAME}"
