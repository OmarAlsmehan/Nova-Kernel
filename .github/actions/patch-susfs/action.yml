name: SuSFS integration
description: Apply SuSFS kernel integration.
runs:
  using: composite
  steps:
    - name: 🛡️ Add SuSFS
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_WORKSPACE"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🛡️ SuSFS integration"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        curl https://raw.githubusercontent.com/OmarAlsmehan/Random-stuff/refs/heads/main/0001-Import-de-inlined-hooks-SUSFS-v2.3.0.patch | patch -p1
        rm -rf drivers/kernelsu
        curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
        echo "✅ SuSFS step finished"
